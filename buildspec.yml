# AWS only; Vercel does not use this file.
version: 0.2
env:
  shell: bash
  variables:
    BUILD_STANDALONE: "true"
    NEXT_TELEMETRY_DISABLED: "1"
phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci --no-audit --no-fund
  build:
    on-failure: ABORT
    commands:
      - npm run build
      - bash deploy/ec2/package.sh
artifacts:
  base-directory: build/codedeploy
  files:
    - "**/*"
