version: 0.0
os: linux
files:
  - source: app
    destination: /var/www/portfolio
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: deploy/stop.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: deploy/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: deploy/validate.sh
      timeout: 180
      runas: root
